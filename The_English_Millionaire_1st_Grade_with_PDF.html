</style></head><body><div id="app"></div><div id="modal-root"></div><noscript>This game needs JavaScript. Enable JavaScript and reopen the file.</noscript><script>const GAME={grade:'FIRST GRADE',shortGrade:'1ST GRADE',book:'HARMONIZE 2',theme:'PAST TIME DETECTIVES',tagline:'Follow the clues. Build the story.',saveKey:'cmc-english-millionaire-first-v1',exit:'Tell a short story using the Past Simple and the Past Continuous.',matchIds:[0,3,6,10],matchOrder:[10,6,0,3],check:{prompt:'Which sentence describes an action in progress at 7:00?',choices:['I was drawing at 7:00.','I finished my drawing at 7:00.'],right:0,yes:'Correct. Was drawing shows an action in progress; finished tells us it ended.',no:'Finished tells us the action ended. Was drawing shows an action in progress.'}};
const CATEGORIES=[
 {id:0,title:'Yesterday’s Clues',subtitle:'Past Simple: actions, negatives & questions',icon:'01',color:'blue'},
 {id:1,title:'Freeze the Moment',subtitle:'Past Continuous: what was happening?',icon:'02',color:'purple'},
 {id:2,title:'Two Actions, One Story',subtitle:'When, while & actions in progress',icon:'03',color:'gold'},
 {id:3,title:'The Word Detectives',subtitle:'Feelings, objects & materials',icon:'04',color:'teal'}
];
const QUESTIONS=[
 {cat:0,type:'Complete the sentence',topic:'Regular past verbs',prompt:'Our class ___ the art gallery last Tuesday.',options:['visit','was visit','visited','visiting'],answer:2,why:'Last Tuesday is a finished past time, and the regular past form of visit is visited.',tip:'For many regular verbs, add -ed to talk about a finished past action.',retry:'The action happened at a finished time in the past.'},
 {cat:0,type:'Find the past form',topic:'Irregular past verbs',prompt:'Yesterday, Sam ___ his bus pass on the way to school.',options:['lost','lose','losing','was lose'],answer:0,why:'Lost is the irregular Past Simple form of lose.',tip:'Some past forms are irregular: lose becomes lost.',retry:'Yesterday tells us to use the past form.'},
 {cat:0,type:'Correct the negative',topic:'Didn’t + base verb',context:'Correct: “We didn’t watched the film.”',prompt:'Which sentence is correct?',options:['We didn’t watching the film.','We don’t watched the film.','We wasn’t watch the film.','We didn’t watch the film.'],answer:3,why:'After didn’t, use the base verb watch, not watched.',tip:'Past Simple negative: didn’t + base verb.',retry:'Didn’t already shows past time.'},
 {cat:0,type:'Choose the past of be',topic:'Was / were',prompt:'Lena and I ___ at the library yesterday afternoon.',options:['was','were','is','be'],answer:1,why:'Lena and I means we, so the past form of be is were.',tip:'I/he/she/it was; you/we/they were.',retry:'There are two people, so think of the subject we.'},
 {cat:0,type:'Ask a question',topic:'Questions with be',prompt:'___ your brother at the football match last night?',options:['Did','Were','Was','Does'],answer:2,why:'Your brother is one person, so a past question with be starts with Was.',tip:'For past questions with be, put was or were before the subject.',retry:'Your brother is singular, and the sentence needs the past form of be.'},
 {cat:0,type:'Choose the correct question',topic:'Did + base verb',context:'You want to know if a friend enjoyed yesterday’s school trip.',prompt:'Which question is correct?',options:['Did you enjoy the trip?','Did you enjoyed the trip?','Were you enjoy the trip?','Do you enjoyed the trip?'],answer:0,why:'A Past Simple question with an action verb uses did + subject + base verb.',tip:'Use Did + subject + base verb? for a Past Simple action question.',retry:'After did, the main verb stays in its base form.'},
 {cat:1,type:'Freeze the moment',topic:'Was + verb-ing',prompt:'At 8:00 last night, I ___ a picture for my buddy.',options:['draw now','were drawing','was draw','was drawing'],answer:3,why:'Was drawing describes an action in progress at that past time, and I takes was.',tip:'Past Continuous: was/were + verb-ing.',retry:'Use was with I and the -ing form of draw.'},
 {cat:1,type:'Complete the action',topic:'Were + verb-ing',prompt:'The students ___ a poster at 10:00 yesterday morning.',options:['was making','were making','were make','are make'],answer:1,why:'The students means they, so the Past Continuous form is were making.',tip:'Use were + verb-ing with you, we and they.',retry:'The subject is plural, so was does not fit.'},
 {cat:1,type:'Make it negative',topic:'Past Continuous negative',context:'Nora was reading. She was not watching a video.',prompt:'Nora ___ a video at that moment.',options:['weren’t watching','didn’t watching','wasn’t watching','wasn’t watch'],answer:2,why:'Nora is one person, so the negative Past Continuous is wasn’t + watching.',tip:'Negative: wasn’t/weren’t + verb-ing.',retry:'Choose the singular helping verb and keep the -ing ending.'},
 {cat:1,type:'Ask what was happening',topic:'Past Continuous questions',prompt:'Which question is correct?',options:['What were you doing at 6:00?','What you were doing at 6:00?','What did you doing at 6:00?','What were you do at 6:00?'],answer:0,why:'A Past Continuous question puts were before you and keeps the -ing form doing.',tip:'Question word + was/were + subject + verb-ing?',retry:'In this question, were must come before you.'},
 {cat:1,type:'Understand the meaning',topic:'An action in progress',context:'“At 9:00, Ben was building a small model.”',prompt:'What do we know?',options:['He finished the model at 9:00.','He builds a model every day.','He will start the model tomorrow.','He was in the middle of building it at 9:00.'],answer:3,why:'Was building shows an action in progress at 9:00, without saying when it finished.',tip:'The Past Continuous focuses on an action while it is happening.',retry:'The sentence tells us what was happening, not when it ended.'},
 {cat:2,type:'Complete the story',topic:'Past Continuous + Past Simple',prompt:'I ___ my backpack when I found an old photograph.',options:['am cleaning','was cleaning','were cleaning','was clean'],answer:1,why:'Was cleaning describes the action in progress when the shorter event, found, happened.',tip:'A common story pattern is was/were + verb-ing when + Past Simple.',retry:'Finding the photograph happened during the longer action.'},
 {cat:2,type:'Choose the shorter event',topic:'An event with when',prompt:'Ella was painting when her buddy ___ at the door.',options:['knock','was knock','knocked','knocking'],answer:2,why:'Knocked is the Past Simple event that happened during the painting.',tip:'Use the Past Simple for the shorter event in this story.',retry:'The blank needs a complete past-tense verb.'},
 {cat:2,type:'Two actions at the same time',topic:'While',prompt:'While Leo was reading, his sister ___ a model beside him.',options:['was building','were building','was build','is build'],answer:0,why:'Was building shows a second action in progress at the same past time.',tip:'While can connect two actions that were in progress together.',retry:'His sister is one person, and her action was in progress too.'},
 {cat:2,type:'Read the clue',topic:'Which action was in progress?',context:'“We were walking to school when the rain started.”',prompt:'Which action was already in progress?',options:['The rain starting','The school closing','The lesson ending','Walking to school'],answer:3,why:'Were walking describes the action already in progress when the rain started.',tip:'The Past Continuous often gives the background action in a story.',retry:'Find the action with were + verb-ing.'},
 {cat:2,type:'Correct the story',topic:'Was and were in a story',context:'Correct: “While the boys was playing, a dog ran onto the field.”',prompt:'Which change fixes the mistake?',options:['Change ran to run.','Change was playing to were playing.','Change boys to they was.','Change playing to played.'],answer:1,why:'The boys is plural, so the background action needs were playing.',tip:'Match was or were to the subject before adding verb-ing.',retry:'Look at how many people are playing.'},
 {cat:3,type:'Complete the feeling',topic:'Glad and buddy',prompt:'My ___ found my missing notebook, and I felt ___ to get it back.',options:['wood / enormous','photograph / wool','buddy / glad','glass / awful'],answer:2,why:'A buddy is a close friend, and glad means happy or relieved.',tip:'Buddy = a close friend; glad = happy or relieved.',retry:'The first gap needs a person and the second needs a happy feeling.'},
 {cat:3,type:'Find the meaning',topic:'Awful',context:'“The food tasted awful, so I stopped eating it.”',prompt:'What does awful mean?',options:['Very bad','Very big','Lovely to look at','A close friend'],answer:0,why:'Awful means very bad or unpleasant.',tip:'Awful describes something very bad.',retry:'The speaker stopped eating because the taste was unpleasant.'},
 {cat:3,type:'Choose the adjective',topic:'Enormous',prompt:'The model was not small. It was ___: it filled almost the whole room!',options:['truthful','simple','glad','enormous'],answer:3,why:'Enormous means very big.',tip:'Enormous = extremely large.',retry:'Look at the clue: almost the whole room.'},
 {cat:3,type:'Borrow or lend?',topic:'Borrow and lend',context:'Mia has a ruler. You need it for one minute and will return it.',prompt:'What should you ask?',options:['Can I lend your ruler?','Can I borrow your ruler?','Can you borrow me your ruler?','Can I keep your ruler forever?'],answer:1,why:'Borrow means receive something for a short time and then return it.',tip:'You borrow from someone; they lend to you.',retry:'You are the person receiving the ruler temporarily.'},
 {cat:3,type:'Understand the situation',topic:'Attempt',context:'Ben tried to solve the puzzle three times.',prompt:'How many attempts did he make?',options:['One','Two','Three','Four'],answer:2,why:'An attempt is a try, so three tries means three attempts.',tip:'Attempt = a try or an effort to do something.',retry:'Count the number of tries in the sentence.'},
 {cat:3,type:'Match three materials',topic:'Wood, glass and wool',context:'Match in this order: wood / glass / wool.',prompt:'Which set of descriptions is correct?',options:['material from trees / clear, hard material / fibre from sheep','fibre from sheep / material from trees / a picture','clear, hard material / a gift / material from trees','a kind / a picture / a try'],answer:0,why:'Wood comes from trees, glass is a clear hard material, and wool is a fibre from sheep.',tip:'Think about a wooden desk, a glass window and a wool jumper.',retry:'The first material comes from trees.'},
 {cat:3,type:'Identify the object',topic:'Photograph and present',context:'For my birthday, my friend gave me a printed picture of us at the beach.',prompt:'Which statement is correct?',options:['The present was a type of wool.','The photograph was an attempt to borrow.','The present was a wooden tree.','The photograph was a present.'],answer:3,why:'A photograph is a picture, and a present is a gift.',tip:'Photograph = picture; present = gift in this context.',retry:'Your friend gave you a picture as a birthday gift.'},
 {cat:3,type:'Find two meanings',topic:'Type and like',context:'“What type of music do you like?”',prompt:'What do type and like mean here?',options:['picture / borrow','kind / enjoy','gift / attempt','material / lose'],answer:1,why:'Type means kind or category, and like means enjoy in this question.',tip:'Type = kind; like = enjoy.',retry:'The question asks which kind of music you enjoy.'},
 {cat:3,type:'Choose the meaning',topic:'Beautiful',context:'“The sunset was beautiful, so we stopped to look at it.”',prompt:'What does beautiful mean?',options:['Very bad','Very difficult','Lovely to look at','Made from glass'],answer:2,why:'Beautiful means very attractive or lovely to look at.',tip:'Beautiful describes something very pleasant to see.',retry:'The sunset made people want to stop and look.'}
].map((q,i)=>({...q,id:i,points:1000,team:i%5}));
const RIDDLE={title:'The warm mystery',passage:'Yesterday, Nora’s grandma gave me to her as a present. I was keeping Nora warm while she was walking to school. I am long and soft. My material comes from sheep. Nora wears me around her neck. I am not alive, and I have no sleeves. What am I?',options:['A glass bottle','A wool scarf','A wooden chair','A photograph'],answer:1,points:5000,why:'The object is long, soft, made of wool from sheep and worn around the neck, so it is a wool scarf.'};
const WORDS=[['glad','happy or relieved'],['awful','very bad'],['enormous','very big'],['buddy','a close friend'],['photograph','a picture'],['attempt','a try'],['borrow','receive something temporarily and return it'],['wood','material from trees'],['beautiful','lovely to look at'],['type','a kind or category'],['like','enjoy'],['glass','a clear, hard material'],['wool','fibre from sheep'],['present','a gift'],['lend','give something temporarily for someone to return']];
const LESSONS=[{id:'0',title:'Past Simple'},{id:'1',title:'Past Continuous'},{id:'2',title:'When & while'}];
function lessonBody(tab){const card=(title,example,text)=>`<div class="toolkit-item"><h3>${title}</h3><p class="example">${example}</p><p>${text}</p></div>`;
 if(tab==='0')return `<div class="toolkit-grid">${card('Finished past actions','I visited the museum yesterday.','For many regular verbs, add -ed. Learn irregular forms, such as lose → lost.')}${card('Negative actions','I didn’t see my friends.','Use didn’t + base verb. Say didn’t see, not didn’t saw.')}${card('Past of be','Mia was glad. They were at home.','I/he/she/it was; you/we/they were.')}${card('Questions with be','Were they at the cinema?','Put was or were before the subject. Do not add did with be here.')}${card('Questions with action verbs','Did you visit the museum?','Use Did + subject + base verb?')}</div><p class="original-note">Team task: Say one thing you did yesterday and one thing you didn’t do.</p>`;
 if(tab==='1')return `<div class="toolkit-grid">${card('The form','I was studying at 7 p.m.','Past Continuous: was/were + verb-ing. It shows an action in progress at a past moment.')}${card('Singular subjects','She was watching a series.','Use was with I, he, she and it.')}${card('You, we and they','We were playing football.','Use were with you, we and they.')}${card('Negative form','I wasn’t sleeping.','Use wasn’t or weren’t + verb-ing.')}${card('Question form','What were you doing?','Put was or were before the subject.')}</div>${checkpoint()}`;
 if(tab==='2')return `<div class="comparison"><p class="sentence">I <strong>was walking</strong> home when I <strong>saw</strong> a dog.</p><div class="row">${button('Show the action in progress','compare','btn '+(compareMode==='first'?'primary':''),'data-mode="first"')}${button('Show the shorter event','compare','btn '+(compareMode==='second'?'primary':''),'data-mode="second"')}</div><div class="reveal" role="status">${compareMode==='first'?'<strong class="gold">I was walking home</strong><small>The walking was already in progress. Use the Past Continuous to set the scene.</small>':'<strong class="gold">I saw a dog</strong><small>Seeing the dog happened during the walk. Use the Past Simple for this event.</small>'}</div></div><div class="toolkit-grid">${card('Two actions together','While I was reading, he was drawing.','Both actions were in progress at the same time.')}${card('Choose the tense by meaning','I was walking when I saw a dog.','While often introduces an action in progress. When can introduce an event, but the meaning of the story decides the tense.')}</div><p class="original-note">Team task: Describe what you were doing when the last school bell rang.</p>`;
 return '';
}

const SAVE_KEY=GAME.saveKey;
const DEFAULT_NAMES=['The Trailblazers','The Thinkers','The Creators','The Explorers','The Changemakers'];
function newState(){return {version:1,screen:'welcome',category:0,teams:DEFAULT_NAMES.map(name=>({name,score:0,used:{half:false,team:false,second:false}})),records:{},current:null,final:{status:'ready',remaining:20,picks:[null,null,null,null,null],locked:[false,false,false,false,false],revealed:false},sound:false,completed:false};}
function freshRecord(team){return {team,status:'ready',remaining:20,hidden:[],wrong:[],armed:false,used:{half:false,team:false,second:false},selected:null,points:0};}
function loadState(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s||s.version!==1||s.teams?.length!==5||!s.records||!s.final)return newState();if(!s.teams.every(t=>typeof t.name==='string'&&Number.isFinite(t.score)&&t.used))return newState();for(const r of Object.values(s.records)){if(r.status==='running')r.status='paused';}if(s.final.status==='running')s.final.status='paused';if(s.current!==null&&!QUESTIONS[s.current])return newState();return s;}catch{return newState();}}
let state=loadState();
let storageOK=true;
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch{storageOK=false;}}
function record(id=state.current){return state.records[id];}
function openQuestion(id){if(!QUESTIONS[id])return false;pauseActive();state.current=id;state.category=QUESTIONS[id].cat;state.screen='question';if(!state.records[id])state.records[id]=freshRecord(QUESTIONS[id].team);persist();return true;}
function pauseActive(){if(state.screen==='question'&&record()?.status==='running')record().status='paused';if(state.screen==='final'&&state.final.status==='running')state.final.status='paused';}
function goMenu(){pauseActive();state.screen='menu';persist();}
function doneCount(cat=null){return QUESTIONS.filter(q=>(cat===null||q.cat===cat)&&record(q.id)?.status==='done').length;}
function nextInCategory(cat){return QUESTIONS.find(q=>q.cat===cat&&record(q.id)?.status!=='done');}
function activeTimer(){return state.screen==='question'?record():state.screen==='final'?state.final:null;}
function toggleTimer(){const r=activeTimer();if(!r||r.status==='done'||r.status==='retry'||r.revealed)return false;if(r.status==='running'){r.status='paused';}else if(['ready','paused'].includes(r.status)){r.status='running';}else return false;persist();return true;}
function finishQuestion(correct,selected){const r=record();if(!r||r.status==='done')return false;r.status='done';r.selected=selected;r.points=correct?QUESTIONS[state.current].points:0;state.teams[r.team].score+=r.points;persist();return true;}
function submitAnswer(index){const r=record();if(!r||!['running','paused'].includes(r.status)||r.hidden.includes(index)||r.wrong.includes(index)||!Number.isInteger(index)||index<0||index>3)return 'ignored';if(r.remaining<=0)return 'ignored';const q=QUESTIONS[state.current];if(index===q.answer){finishQuestion(true,index);return 'correct';}r.wrong.push(index);if(r.armed){r.armed=false;r.status='retry';r.remaining=20;persist();return 'retry';}finishQuestion(false,index);return 'incorrect';}
function resumeRetry(){const r=record();if(r?.status!=='retry')return false;r.status='paused';persist();return true;}
function useLifeline(kind){const r=record();if(!r||!['ready','running','paused'].includes(r.status)||!['half','team','second'].includes(kind))return false;const team=state.teams[r.team];if(team.used[kind]||r.used[kind])return false;team.used[kind]=true;r.used[kind]=true;if(kind==='half'){const wrong=[0,1,2,3].filter(i=>i!==QUESTIONS[state.current].answer&&!r.wrong.includes(i));r.hidden=wrong.slice(0,2);}if(kind==='team'){r.remaining+=20;if(r.status==='running')r.status='paused';}if(kind==='second')r.armed=true;persist();return true;}
function changeTeam(team){const r=record();if(!r||r.status!=='ready'||Object.values(r.used).some(Boolean)||team<0||team>4)return false;r.team=team;persist();return true;}
function tick(seconds){const r=activeTimer();if(!r||r.status!=='running')return false;r.remaining=Math.max(0,r.remaining-seconds);if(r.remaining<=0){if(state.screen==='question')finishQuestion(false,null);else{r.status='collecting';persist();}return true;}return false;}
function enterFinal(){pauseActive();state.screen='final';persist();}
function setFinalPick(team,index){const f=state.final;if(f.revealed||f.locked[team]||!['running','paused','collecting'].includes(f.status)||!Number.isInteger(index)||index<0||index>3)return false;f.picks[team]=index;persist();return true;}
function lockFinal(team){const f=state.final;if(f.revealed||f.locked[team]||!['running','paused','collecting'].includes(f.status))return false;f.locked[team]=true;persist();return true;}
function revealFinal(){const f=state.final;if(f.revealed||!f.locked.every(Boolean))return false;f.picks.forEach((a,i)=>{if(a===RIDDLE.answer)state.teams[i].score+=RIDDLE.points;});f.revealed=true;f.status='done';state.completed=true;persist();return true;}
function updateScores(names,scores){if(names.length!==5||scores.length!==5||scores.some(x=>!Number.isInteger(x)||x<0||x>9999999))return false;state.teams.forEach((t,i)=>{t.name=String(names[i]).trim().slice(0,28)||`Team ${i+1}`;t.score=scores[i];});persist();return true;}
function resetGame(){const sound=state.sound;state=newState();state.sound=sound;persist();}

const app=document.getElementById('app');
const modalRoot=document.getElementById('modal-root');
const TEAM_COLORS=['#6eacff','#b79aff','#efcb7c','#75d5c1','#f4a4c5'];
let modal=null, previousFocus=null, wordOpen=new Set(), compareMode='first', matchSelected=null, matchDone=[], matchMessage='', audioCtx=null;
const MATCH_IDS=GAME.matchIds;
const MATCH_ORDER=GAME.matchOrder;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=n=>new Intl.NumberFormat('en-GB').format(n);
const icon=(name)=>{const paths={menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',sound:'<path d="M11 5 6 9H3v6h3l5 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',mute:'<path d="M11 5 6 9H3v6h3l5 4V5Zm5 4 5 6m0-6-5 6"/>',full:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v.2"/>',book:'<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1m0-15c3-2 6-2 9-1v15c-3-1-6-1-9 1V5Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',play:'<path d="m8 4 12 8-12 8V4Z"/>',check:'<path d="m4 12 5 5L20 6"/>',team:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/>',repeat:'<path d="M4 10a8 8 0 1 1 0 6m0-12v6h6"/>',edit:'<path d="m4 16 12-12 4 4L8 20H4v-4Zm10-10 4 4"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.arrow}</svg>`;};
const STUDY_GUIDE_URL='https://drive.google.com/file/d/1rcOPs__OsrRjDREHeTlYx7o97shO56Lt/view?usp=drivesdk';
const studyGuideLink=()=>`<a class="btn study-guide" href="${STUDY_GUIDE_URL}" target="_blank" rel="noopener noreferrer" aria-label="Open the study guide PDF in Google Drive (new tab)" title="Open the PDF in a new tab">${icon('book')} <span>Study Guide · PDF</span></a>`;
const button=(label,action,cls='btn',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
function header(){return `<header class="topbar"><div class="brand"><div class="brand-mark"><span>EM</span></div><div class="brand-copy">THE ENGLISH MILLIONAIRE<small>CMC · ${GAME.grade} · ART & LANGUAGE</small></div></div><nav class="top-actions" aria-label="Game controls">${state.screen!=='welcome'?button(`${icon('menu')}<span class="desktop-label">Menu</span>`,'menu','btn ghost','aria-label="Main menu"'):''}${button(icon('help'),'help','icon-btn','aria-label="How to play" title="How to play"')}${button(icon(state.sound?'sound':'mute'),'sound','icon-btn',`aria-label="${state.sound?'Mute sound':'Enable sound'}" title="${state.sound?'Sound on':'Sound off'}" aria-pressed="${state.sound}"`)}${document.documentElement.requestFullscreen?button(icon('full'),'fullscreen','icon-btn','aria-label="Toggle full screen" title="Full screen"'):''}</nav></header>`;}
function footer(){return `<footer class="footer"><span>${GAME.book} · UNITS 1 + 2 <span class="extra"> · ENGLISH THROUGH TEAMWORK</span></span><span>${storageOK?'Progress saved on this device':'Saving unavailable. Keep this tab open.'} · ${button('How to play','help','')}</span></footer>`;}
function scoreboard(){let active=state.screen==='question'?record()?.team:-1;return `<aside class="scoreboard" aria-label="Five-team scoreboard"><div class="scoreboard-head"><h2>THE TEAMS</h2>${button('Edit scores','scores','text-btn')}</div>${state.teams.map((t,i)=>`<div class="team-row ${active===i?'active':''}" style="--team-color:${TEAM_COLORS[i]}">${active===i?'<div class="active-label">ON THE HOT SEAT</div>':''}<div class="team-name"><span class="team-dot"></span>${esc(t.name)}</div><div class="score">${number(t.score)}</div><div class="lifes"><span class="${t.used.half?'life-used':''}">50:50</span><span class="${t.used.team?'life-used':''}">TEAM</span><span class="${t.used.second?'life-used':''}">2×</span></div></div>`).join('')}<div class="note">One use of each lifeline per team.<br>Every new question is worth 1,000 points.</div><div class="track-label">${doneCount()} OF 25 CHALLENGES COMPLETE</div><div class="progress-track"><div class="progress-fill" style="width:${doneCount()/25*100}%"></div></div></aside>`;}
function render(){const screens={welcome:welcomeView,menu:menuView,question:questionView,category:categoryView,final:finalView,winner:winnerView};const view=screens[state.screen]||welcomeView;app.innerHTML=header()+view()+footer();renderTimer();}
function welcomeView(){const hasProgress=Object.keys(state.records).length>0||state.final.status!=='ready';return `<main class="hero"><div class="hero-orbit"></div><div class="hero-inner enter"><div class="hero-line"></div><div class="eyebrow gold"><span class="live-dot"></span>${GAME.theme}</div><h1><span>The English</span><strong>Millionaire</strong></h1><p>${GAME.tagline}<br>Five teams. One unforgettable challenge.</p><div class="row">${button(`${hasProgress?'CONTINUE GAME':'START GAME'} ${icon('arrow')}`,'start','btn primary')}${button('How to play','help','btn ghost')}${studyGuideLink()}</div><div class="hero-meta"><span>${GAME.shortGrade}</span><span>5 TEAMS</span><span>35–45 MIN</span></div>${hasProgress?`<div style="margin-top:20px">${button('Start a new game','reset','text-btn')}</div>`:''}</div></main>`;}
function menuView(){return `<main class="main enter"><div class="layout"><section class="content"><div class="page-heading menu-head"><div class="eyebrow">YOUR ROAD TO THE FINAL</div><h1>Choose your challenge.</h1><p>Take turns. Think together. Tell us why.</p></div><div class="category-list">${CATEGORIES.map(c=>{const total=QUESTIONS.filter(q=>q.cat===c.id).length,done=doneCount(c.id);return `<button class="category" data-action="category" data-id="${c.id}" style="--accent:${["var(--blue)","var(--purple)","var(--gold)","var(--teal)"][c.id]}"><div class="row"><span class="number">LEVEL ${c.icon}</span><div class="mini-progress"><span style="width:${done/total*100}%"></span></div></div><h2>${c.title}</h2><p>${c.subtitle}</p><div class="row between"><span class="category-status">${done===total?'Complete · review available':`${done} / ${total} complete`}</span>${icon('arrow')}</div></button>`;}).join('')}</div><button class="final-card" data-action="final-gate"><span class="final-icon">?</span><div><h2>The Mystery Riddle</h2><p>One story. Five secret answers. One big reveal.</p></div><span class="tag">${state.final.revealed?'VIEW RESULTS':'+5,000 PER TEAM'}</span>${icon('arrow')}</button><div class="row between menu-bottom"><div class="tip-box">Play the levels in order for a gradual challenge.<br>Use the toolkit to pause, compare and practise.</div><div class="row">${studyGuideLink()}${button(`${icon('book')} Learning toolkit`,'toolkit','btn ghost')}</div></div></section>${scoreboard()}</div></main>`;}
let categoryId=state.category??0;
function categoryView(){const cat=CATEGORIES[categoryId];const qs=QUESTIONS.filter(q=>q.cat===cat.id);const next=nextInCategory(cat.id);return `<main class="main enter"><div class="layout"><section class="content"><div class="page-heading"><div class="eyebrow">LEVEL ${cat.icon} · ${qs.length} CHALLENGES</div><h1>${cat.title}</h1><p>${cat.subtitle}</p></div><div class="row" style="margin-bottom:26px">${next?button(`Continue level ${icon('arrow')}`,'open-question','btn primary',`data-id="${next.id}"`):'<div class="empty-success">Level complete. Choose any question to review it.</div>'}${button(`${icon('book')} ${cat.id===3?'Word power-up':'Quick revision'}`,'toolkit','btn',`data-tab="${cat.id===3?'words':cat.id}"`)}</div><div class="category-list">${qs.map(q=>{const r=record(q.id),done=r?.status==='done';return `<button class="category" style="min-height:155px" data-action="open-question" data-id="${q.id}"><div class="number">CHALLENGE ${String(q.id+1).padStart(2,'0')} ${done?'· REVIEW':''}</div><h2 style="font-size:23px">${q.topic}</h2><p>${q.type}</p><div class="row between"><span class="category-status">${done?(r.points?'+1,000 points':'Reviewed · 0 points'):esc(state.teams[r?.team??q.team].name)}</span>${icon('arrow')}</div></button>`;}).join('')}</div><div class="menu-bottom">${button(`${icon('back')} All levels`,'menu','btn ghost')}</div></section>${scoreboard()}</div></main>`;}
function levelNav(current){return `<nav class="level-nav" aria-label="Levels">${CATEGORIES.map(c=>button(`${c.icon}<span> · ${c.title}</span>`,'category',`level-step ${c.id===current?'current':''} ${doneCount(c.id)===QUESTIONS.filter(q=>q.cat===c.id).length?'complete':''}`,`data-id="${c.id}"`)).join('')}${button('FINAL','final-gate',`level-step ${current===4?'current':''}`)}</nav>`;}
function clockHTML(){return `<div class="clock-wrap"><div class="clock" id="clock"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28"/><circle class="arc" id="clock-arc" cx="32" cy="32" r="28"/></svg><strong id="clock-value" aria-label="Seconds remaining">20</strong></div><div class="clock-buttons">${button('Start timer','timer','btn ghost','id="timer-button"')}<small id="timer-status">READ FIRST</small></div></div>`;}
function questionView(){const q=QUESTIONS[state.current],r=record(),team=state.teams[r.team],cat=CATEGORIES[q.cat],finished=r.status==='done';const enabled=['running','paused'].includes(r.status)&&!modal;return `<main class="main enter"><div class="layout"><section class="content">${levelNav(q.cat)}<div class="row between question-top"><div><div class="eyebrow" style="margin-bottom:9px">LEVEL ${cat.icon} · QUESTION ${q.id+1} / 25</div><h1>${cat.title}</h1><div class="question-meta" style="margin-top:8px">${esc(team.name)} <span class="gold">· 1,000 points</span>${finished?' · REVIEW':''}</div></div>${clockHTML()}</div><div class="stage"><div class="question-kind">${q.type.toUpperCase()}</div>${q.context?`<p class="context">${esc(q.context)}</p>`:''}<h2 class="question">${esc(q.prompt)}</h2></div><div class="answers">${q.options.map((o,i)=>{const eliminated=r.hidden.includes(i),wrong=r.wrong.includes(i),correct=finished&&q.answer===i;return button(`<span class="letter">${'ABCD'[i]}</span><span class="answer-text">${eliminated?'Option removed':esc(o)}</span>${correct?'<span class="result-icon" aria-label="Correct answer">✓</span>':wrong?'<span class="result-icon" aria-label="Incorrect answer">×</span>':''}`,'answer',`answer ${eliminated?'eliminated':''} ${correct?'correct':''} ${wrong?'incorrect':''}`,`data-index="${i}" ${!enabled||eliminated||wrong?'disabled':''} aria-label="${'ABCD'[i]}. ${eliminated?'Option removed':esc(o)}"`);}).join('')}</div><div class="lifelines">${button('<strong>50:50</strong> Remove two','lifeline','btn',`data-kind="half" title="Remove two wrong answers. Once per team." ${finished||r.status==='retry'||team.used.half?'disabled':''}`)}${button(`${icon('team')} Ask Your Team`,'lifeline','btn',`data-kind="team" title="Add 20 seconds and discuss. Once per team." ${finished||r.status==='retry'||team.used.team?'disabled':''}`)}${button(`${icon('repeat')} ${r.armed?'Second Chance armed':'Second Chance'}`,'lifeline',`btn ${r.armed?'armed':''}`,`data-kind="second" title="Activate before answering to get one retry. Once per team." ${finished||r.status==='retry'||team.used.second?'disabled':''}`)}${button(`${icon('book')} GRAMMAR TIP`,'tip','btn')}</div>${questionFeedback(q,r)}<div class="question-pagination" aria-label="Question navigation">${QUESTIONS.filter(x=>x.cat===q.cat).map(x=>{const a=record(x.id);return button(String(x.id+1),'open-question',`q-dot ${x.id===q.id?'current':''} ${a?.status==='done'?(a.points?'done':'missed'):''}`,`data-id="${x.id}" aria-label="Open question ${x.id+1}: ${x.topic}"`);}).join('')}<span class="spacer"></span>${button('Level overview','category','btn ghost',`data-id="${q.cat}"`)}</div>${r.status==='ready'&&!Object.values(r.used).some(Boolean)?`<div class="teacher-route">Team rotation is automatic. ${button('Change answering team','choose-team','')}</div>`:''}</section>${scoreboard()}</div></main>`;}
function questionFeedback(q,r){if(r.status==='done'){const correct=r.points>0;const title=correct?`Correct! +${number(r.points)} points`:r.selected===null?'Time is up. Let’s learn from it.':'Good try. Here’s the answer.';const next=nextInCategory(q.cat);return `<div class="feedback ${correct?'good':'bad'}" role="status"><div class="row"><div class="feedback-copy"><h3>${title}</h3><p>${!correct?`<strong>${'ABCD'[q.answer]} · ${esc(q.options[q.answer])}.</strong> `:''}${esc(q.why)}</p></div>${button(`${next?'Next challenge':'Level complete'} ${icon('arrow')}`,'next','btn primary')}</div></div>`;}if(r.status==='retry')return `<div class="feedback bad" role="status"><h3>Second Chance. You have one more try.</h3><p>${esc(q.retry)}</p><div style="margin-top:15px">${button('Try again · 20 seconds','retry','btn primary')}</div></div>`;if(r.status==='ready')return `<div class="ready-strip"><span>Read together. One spokesperson gives the team’s answer.<br><span class="small muted">Press Start timer when everyone is ready.</span></span>${button(`${icon('play')} Start timer`,'timer','btn primary')}</div>`;if(r.status==='paused')return `<div class="ready-strip"><span>Timer paused. Discuss the sentence, then resume or choose an answer.</span>${button(`${icon('play')} Resume`,'timer','btn')}</div>`;return `<div class="teacher-route">Choose A, B, C or D. Explain your choice after the reveal. ${r.armed?'<span class="gold">Your Second Chance is active.</span>':''}</div>`;}
function finalView(){const f=state.final;return `<main class="main enter"><div class="layout"><section class="content">${levelNav(4)}<div class="row between question-top"><div><div class="eyebrow gold">FINAL LEVEL · ALL FIVE TEAMS</div><h1>The Mystery Riddle</h1><div class="question-meta" style="margin-top:8px">+5,000 points for each correct team</div></div>${clockHTML()}</div><div class="riddle-paper"><p>${esc(RIDDLE.passage)}</p></div><div class="answers final-options">${RIDDLE.options.map((o,i)=>`<div class="answer ${f.revealed&&i===RIDDLE.answer?'correct':''}"><span class="letter">${'ABCD'[i]}</span><span class="answer-text">${esc(o)}</span>${f.revealed&&i===RIDDLE.answer?'<span aria-label="Correct answer">✓</span>':''}</div>`).join('')}</div>${f.status==='ready'?`<div class="ready-strip"><span>Read the riddle together first. Then start 20 seconds.<br>All teams write A, B, C or D on paper and keep it hidden.<br><span class="small muted">No lifelines or hints in the final. Everyone has the same chance.</span></span>${button('Start final timer','timer','btn primary')}</div>`:!f.revealed?`<div class="ready-strip"><span>${f.status==='collecting'?'Pens down. The teacher can now record every team’s answer.':'Teams: write one answer and keep it hidden.'}</span>${['running','paused'].includes(f.status)?button('All teams ready · collect','collect-final','btn'):''}</div>`:''}<div class="final-teams">${state.teams.map((t,i)=>`<div class="final-team ${f.locked[i]?'sealed':''}"><h3>${esc(t.name)}</h3>${f.revealed?`<div class="result-pill">${f.picks[i]===RIDDLE.answer?'+5,000':'0'} points</div><small>${f.picks[i]===null?'No answer':`Answer ${'ABCD'[f.picks[i]]}`}</small>`:button(f.locked[i]?'Locked · edit':'Record answer','final-pick','btn',`data-team="${i}" ${f.status!=='collecting'?'disabled':''}`)}${!f.revealed?`<small>${f.locked[i]?'Answer hidden':'Waiting for a choice'}</small>`:''}</div>`).join('')}</div>${f.revealed?`<div class="feedback good" role="status"><h3>The mystery is solved.</h3><p>${RIDDLE.why}</p><div style="margin-top:18px">${button(`Reveal the winners ${icon('arrow')}`,'winner','btn primary')}</div></div>`:`<div class="row between" style="margin-top:22px"><span class="small muted">${f.locked.filter(Boolean).length} / 5 answers locked</span>${button('REVEAL THE ANSWER','reveal-final','btn primary',`${!f.locked.every(Boolean)?'disabled':''}`)}</div>`}</section>${scoreboard()}</div></main>`;}
function winnerView(){const rank=state.teams.map((t,i)=>({...t,id:i})).sort((a,b)=>b.score-a.score);const top=rank[0].score,winners=rank.filter(x=>x.score===top);return `<main class="main enter"><section class="winners"><div class="eyebrow gold">THE ENGLISH MILLIONAIRE · FINAL RESULTS</div><div class="trophy" aria-hidden="true">✦</div><p class="muted">${winners.length>1?'SHARED VICTORY':'YOUR ENGLISH CHAMPIONS'}</p><h1>${winners.map(x=>esc(x.name)).join('<br>')}</h1><div class="score-huge">${number(top)} points${winners.length>1?' each':''}</div><div class="ranking">${rank.map((t,i)=>`<div class="rank-row"><span>${rank.findIndex(x=>x.score===t.score)+1}</span><strong>${esc(t.name)}</strong><b>${number(t.score)}</b></div>`).join('')}</div><div class="exit-ticket"><h3>One last team challenge</h3><p>Explain one mistake you corrected.<br>Use two vocabulary words in one new sentence.<br>${GAME.exit}</p></div><div class="row" style="justify-content:center">${button(`${icon('book')} Review the game`,'menu','btn')}${button('Edit scores','scores','btn ghost')}${button('Play again','reset','btn primary')}</div></section></main>`;}
function openModal(type,extra={}){pauseActive();persist();previousFocus=document.activeElement;modal={type,...extra};render();renderModal();}
function closeModal(){modal=null;modalRoot.innerHTML='';document.body.style.overflow='';render();if(previousFocus?.isConnected)previousFocus.focus();else{const target=app.querySelector('main button');target?.focus();}}
function modalFrame(title,body,{narrow=false,eyebrow='TEACHER’S TOOLKIT'}={}){return `<div class="modal-layer"><section class="modal ${narrow?'narrow':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><div><div class="eyebrow">${eyebrow}</div><h2 id="modal-title">${title}</h2></div>${button(icon('close'),'close-modal','icon-btn','aria-label="Close dialog"')}</div>${body}</section></div>`;}
function renderModal(){if(!modal)return;document.body.style.overflow='hidden';let html='';if(modal.type==='help')html=modalFrame('How to play',`<p>Five teams of about six students. The teacher controls the screen. Play all 25 questions, then solve the final riddle together.</p><div class="rules-grid"><div class="rule"><h3>01 · Read, then start</h3><p>Read the question before starting the 20-second timer. Teams can discuss quietly. One spokesperson answers for the active team.</p></div><div class="rule"><h3>02 · Fair turns</h3><p>Each team has five turns in the planned order. Every question earns 1,000 points. Wrong answers lose no points. Rotate the spokesperson each turn.</p></div><div class="rule"><h3>03 · Three lifelines</h3><p>Each team gets 50:50, Ask Your Team (+20 seconds) and Second Chance once per game. Activate Second Chance before an answer. It gives one retry after a wrong choice.</p></div><div class="rule"><h3>04 · Explain your choice</h3><p>After the reveal, read the explanation aloud. Other teams can explain the rule too. The free Grammar Tip pauses the clock.</p></div><div class="rule"><h3>05 · The final</h3><p>Read the riddle together, then give all teams 20 seconds to write a secret answer. Record all five answers before revealing. Each correct team earns 5,000 points. Ties share the win.</p></div><div class="rule"><h3>06 · Your classroom</h3><p>Edit team names and scores at any time. Return to any category. Answered questions stay in review mode and cannot award points twice. Progress saves on this device.</p></div></div><div class="keyboard"><strong>35–45 minutes:</strong> 5 minutes to set up and revise, about 1 minute per question, 5 minutes for the final and 5 minutes to reflect.<br><br><kbd>A</kbd>–<kbd>D</kbd> answer · <kbd>Space</kbd> start/pause · <kbd>Enter</kbd> next after feedback · <kbd>Esc</kbd> close a dialog<br>Switching away from this tab pauses the timer. Returning to a question keeps it paused.</div><div class="modal-actions">${button('Edit team names','scores','btn')}${button('Ready to play','close-modal','btn primary')}</div>`);
else if(modal.type==='scores')html=modalFrame('Your teams. Your scoreboard.',`<p>Rename teams or adjust scores. Changes apply when you press Save.</p>${state.teams.map((t,i)=>`<div class="score-edit"><span style="color:${TEAM_COLORS[i]}">${i+1}</span><input id="name-${i}" aria-label="Team ${i+1} name" maxlength="28" value="${esc(t.name)}">${button('−','score-step','icon-btn',`data-team="${i}" data-step="-100" aria-label="Subtract 100 points from team ${i+1}"`)}<input id="score-${i}" type="number" min="0" max="9999999" step="100" aria-label="Team ${i+1} score" value="${t.score}">${button('+','score-step','icon-btn',`data-team="${i}" data-step="100" aria-label="Add 100 points to team ${i+1}"`)}</div>`).join('')}<p id="score-error" class="form-error" role="alert"></p><div class="modal-actions">${button('Cancel','close-modal','btn')}${button('Save teams & scores','save-scores','btn primary')}</div>`);
else if(modal.type==='tip'){const q=QUESTIONS[state.current];html=modalFrame(q.topic,`<p class="explanation">${esc(q.tip)}</p><div class="timer-note">The timer is paused. Resume it when your team is ready.</div><div class="modal-actions">${button('Back to the challenge','close-modal','btn primary')}</div>`,{narrow:true,eyebrow:q.cat===3?'GRAMMAR TIP · WORD HELP':'GRAMMAR TIP'});}
else if(modal.type==='team')html=modalFrame('Ask Your Team',`<p class="explanation">Everyone gets a voice. Compare two possible answers and explain your reasons.</p><p><strong class="gold">20 extra seconds added.</strong> The timer is paused while you get ready.</p><div class="modal-actions">${button('Back to the question','close-modal','btn primary')}</div>`,{narrow:true,eyebrow:'LIFELINE ACTIVATED'});
else if(modal.type==='choose-team')html=modalFrame('Who is answering?',`<p>The default rotation gives each team five turns. Choose a different team for this question if needed.</p><div class="match-col">${state.teams.map((t,i)=>button(esc(t.name),'set-team','btn',`data-team="${i}"`)).join('')}</div>`,{narrow:true});
else if(modal.type==='reset')html=modalFrame('Start a new game?',`<p>This clears the current scores, answers and used lifelines on this device.</p><div class="modal-actions">${button('Keep this game','close-modal','btn')}${button('Start new game','confirm-reset','btn danger')}</div>`,{narrow:true});
else if(modal.type==='final-gate')html=modalFrame('Go to the final now?',`<p>You have completed ${doneCount()} of 25 questions. The planned game gives every team five turns before the final.</p><p>You can go ahead if you are running short of time. Unplayed questions remain available from the menu.</p><div class="modal-actions">${button('Keep playing','close-modal','btn')}${button('Open the final','enter-final','btn primary')}</div>`,{narrow:true});
else if(modal.type==='final-pick'){const t=state.teams[modal.team];html=modalFrame(esc(t.name),`<p>Read this team’s written answer. The choice stays hidden on the main screen until all five teams are locked.</p><div class="answers">${RIDDLE.options.map((o,i)=>button(`<span class="letter">${'ABCD'[i]}</span><span class="answer-text">${esc(o)}</span>`,'lock-pick','answer',`data-team="${modal.team}" data-index="${i}"`)).join('')}</div><div class="modal-actions">${button('No answer','lock-blank','btn ghost',`data-team="${modal.team}"`)}</div>`,{eyebrow:'FINAL · RECORD A SECRET ANSWER'});}
else if(modal.type==='toolkit')html=toolkitView();
modalRoot.innerHTML=html;modalRoot.querySelector('button')?.focus();}
function checkpoint(){return `<p class="original-note">${esc(GAME.check.prompt)}</p><div class="row">${GAME.check.choices.map((choice,i)=>button(esc(choice),'compare-check','btn',`data-choice="${i}"`)).join('')}</div><p id="compare-check-feedback" role="status" style="margin-top:14px"></p>`;}
function toolkitView(){const tab=String(modal.tab??'0');const tabs=[...LESSONS,{id:'words',title:'Word bank'},{id:'match',title:'Match & learn'}];let body='';
if(tab==='words')body=`<p>Tap a word to reveal its meaning. Then use two words in one sentence.</p><div class="word-grid">${WORDS.map(([word,meaning],i)=>button(`${word}<small>${wordOpen.has(i)?esc(meaning):'Tap to reveal'}</small>`,'word','word-card',`data-id="${i}" aria-expanded="${wordOpen.has(i)}"`)).join('')}</div>`;
else if(tab==='match')body=`<p>Choose a word on the left, then its meaning on the right. This warm-up has no score.</p><div class="match-grid"><div class="match-col">${MATCH_IDS.map(i=>button(WORDS[i][0],'match-word',`match-btn ${matchSelected===i?'chosen':''} ${matchDone.includes(i)?'matched':''}`,`data-id="${i}" ${matchDone.includes(i)?'disabled':''}`)).join('')}</div><div class="match-col">${MATCH_ORDER.map(i=>button(WORDS[i][1],'match-meaning',`match-btn ${matchDone.includes(i)?'matched':''}`,`data-id="${i}" ${matchDone.includes(i)?'disabled':''}`)).join('')}</div></div><p role="status" style="margin:20px 0">${matchMessage||'Four pairs. Talk through your choices.'}</p>${matchDone.length===4?button('Match again','match-reset','btn'):''}`;
else body=lessonBody(tab);
return modalFrame('Learning toolkit',`<nav class="tabs" aria-label="Revision topics">${tabs.map(({id,title})=>button(title,'toolkit-tab',`btn ${tab===id?'selected':''}`,`data-tab="${id}" aria-pressed="${tab===id}"`)).join('')}</nav>${body}<div class="modal-actions">${button('Back to the game','close-modal','btn primary')}</div>`,{eyebrow:'PAUSE · COMPARE · PRACTISE'});}
function renderTimer(){const r=activeTimer(),value=document.getElementById('clock-value');if(!r||!value)return;const seconds=Math.max(0,Math.ceil(r.remaining));value.textContent=seconds;document.getElementById('clock')?.classList.toggle('urgent',seconds<=5&&r.status==='running');const arc=document.getElementById('clock-arc');if(arc)arc.style.strokeDashoffset=String(176*(1-Math.min(1,r.remaining/20)));const b=document.getElementById('timer-button');if(b){b.innerHTML=r.status==='running'?`${icon('pause')} Pause`:r.status==='paused'?`${icon('play')} Resume`:`${icon('play')} Start`;b.disabled=!['ready','running','paused'].includes(r.status)||!!modal;}const status=document.getElementById('timer-status');if(status)status.textContent=({ready:'READ FIRST',running:'SECONDS LEFT',paused:'PAUSED',done:'COMPLETE',retry:'SECOND CHANCE',collecting:'PENS DOWN'})[r.status]||'';}
function showToast(message){const old=document.querySelector('.toast');old?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),3300);}
function sound(type){if(!state.sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const tones=type==='correct'?[523,659,784]:type==='win'?[523,659,784,1046]:type==='wrong'?[294,247]:[440];tones.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,audioCtx.currentTime+i*.11);g.gain.linearRampToValueAtTime(.09,audioCtx.currentTime+i*.11+.015);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+i*.11+.3);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+i*.11);o.stop(audioCtx.currentTime+i*.11+.32);});}catch{showToast('Sound is unavailable in this browser.');}}
function celebrate(big=false){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;const el=document.createElement('div');el.className='confetti';el.setAttribute('aria-hidden','true');for(let i=0;i<(big?75:26);i++){const piece=document.createElement('i');piece.style.cssText=`--x:${Math.random()*100}%;--c:${['#efcb7c','#6baaff','#bba0ff','#75d5c1'][i%4]};--d:${1.4+Math.random()*1.5}s;--delay:${Math.random()*.3}s;--r:${Math.random()*360}deg`;el.appendChild(piece);}document.body.appendChild(el);setTimeout(()=>el.remove(),3600);}
function answerAction(index){const result=submitAnswer(index);if(result==='ignored')return;render();if(result==='correct'){sound('correct');celebrate();}else sound('wrong');}
function navigate(action){pauseActive();persist();action();render();window.scrollTo?.({top:0,behavior:'instant'});}
const ACTIONS={
 'start':()=>navigate(()=>{state.screen='menu';persist();}),
 'menu':()=>{if(modal){modal=null;modalRoot.innerHTML='';document.body.style.overflow='';}navigate(goMenu);},
 'category':d=>navigate(()=>{categoryId=Number(d.id);state.category=categoryId;state.screen='category';persist();}),
 'open-question':d=>navigate(()=>openQuestion(Number(d.id))),
 'answer':d=>answerAction(Number(d.index)),
 'timer':()=>{if(toggleTimer()){render();sound('click');}},
 'next':()=>{if(record()?.status!=='done')return;const q=QUESTIONS[state.current],next=nextInCategory(q.cat);if(next)navigate(()=>openQuestion(next.id));else navigate(()=>{categoryId=q.cat;state.screen='category';persist();});},
 'lifeline':d=>{if(useLifeline(d.kind)){if(d.kind==='team')openModal('team');else{render();showToast(d.kind==='half'?'Two wrong options removed.':'Second Chance armed. You get one retry after a wrong answer.');}}},
 'retry':()=>{if(resumeRetry()){toggleTimer();render();}},
 'tip':()=>openModal('tip'),
 'toolkit':d=>openModal('toolkit',{tab:d.tab??'0'}),
 'toolkit-tab':d=>{modal.tab=d.tab;renderModal();},
 'compare':d=>{compareMode=d.mode;renderModal();},
 'compare-check':d=>{const e=document.getElementById('compare-check-feedback');if(e)e.textContent=Number(d.choice)===GAME.check.right?GAME.check.yes:GAME.check.no;},
 'word':d=>{const id=Number(d.id);wordOpen.has(id)?wordOpen.delete(id):wordOpen.add(id);renderModal();},
 'match-word':d=>{matchSelected=Number(d.id);matchMessage=`Now find the meaning of ${WORDS[matchSelected][0]}.`;renderModal();},
 'match-meaning':d=>{const id=Number(d.id);if(matchSelected===null){matchMessage='Choose a word on the left first.';}else if(id===matchSelected){matchDone.push(id);matchSelected=null;matchMessage=matchDone.length===4?'All four pairs match. Use two words in one sentence.':'That’s a match. Choose another word.';sound('correct');}else{matchMessage='Try another meaning. Discuss what your word means.';sound('wrong');}renderModal();},
 'match-reset':()=>{matchDone=[];matchSelected=null;matchMessage='';renderModal();},
 'help':()=>openModal('help'),
 'scores':()=>openModal('scores'),
 'score-step':d=>{const input=document.getElementById('score-'+d.team);input.value=Math.max(0,Math.min(9999999,(Number(input.value)||0)+Number(d.step)));},
 'save-scores':()=>{const names=state.teams.map((_,i)=>document.getElementById('name-'+i).value);const scores=state.teams.map((_,i)=>Number(document.getElementById('score-'+i).value));if(updateScores(names,scores)){closeModal();showToast('Team names and scores saved.');}else document.getElementById('score-error').textContent='Use whole-number scores between 0 and 9,999,999.';},
 'choose-team':()=>openModal('choose-team'),
 'set-team':d=>{if(changeTeam(Number(d.team)))closeModal();},
 'sound':()=>{state.sound=!state.sound;persist();render();if(state.sound)sound('click');},
 'fullscreen':async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{showToast('Full screen is unavailable here. Open the game in its own browser tab.');}},
 'close-modal':closeModal,
 'reset':()=>openModal('reset'),
 'confirm-reset':()=>{resetGame();closeModal();navigate(()=>{});},
 'final-gate':()=>{if(doneCount()<25&&!state.final.revealed)openModal('final-gate');else navigate(enterFinal);},
 'enter-final':()=>{closeModal();navigate(enterFinal);},
 'collect-final':()=>{if(!state.final.revealed&&['running','paused'].includes(state.final.status)){state.final.status='collecting';persist();render();}},
 'final-pick':d=>{if(state.final.status==='collecting')openModal('final-pick',{team:Number(d.team)});},
 'lock-pick':d=>{const t=Number(d.team);state.final.locked[t]=false;if(setFinalPick(t,Number(d.index))&&lockFinal(t)){closeModal();showToast('Answer locked and hidden.');}},
 'lock-blank':d=>{const t=Number(d.team);state.final.picks[t]=null;state.final.locked[t]=false;if(lockFinal(t))closeModal();},
 'reveal-final':()=>{if(revealFinal()){render();sound('correct');celebrate(true);}},
 'winner':()=>{if(state.final.revealed)navigate(()=>{state.screen='winner';persist();});celebrate(true);sound('win');}
};
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const fn=ACTIONS[b.dataset.action];if(fn)fn(b.dataset);});
document.addEventListener('keydown',event=>{if(modal){if(event.key==='Escape'){event.preventDefault();closeModal();return;}if(event.key==='Tab'){const list=[...modalRoot.querySelectorAll('button:not([disabled]), input, a[href]')];const first=list[0],last=list.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}return;}if(event.target?.matches('input,textarea,select')||event.ctrlKey||event.altKey||event.metaKey)return;if(event.repeat)return;if(/^[a-d]$/i.test(event.key)&&state.screen==='question'){event.preventDefault();answerAction('abcd'.indexOf(event.key.toLowerCase()));}if(event.code==='Space'&&['question','final'].includes(state.screen)){event.preventDefault();ACTIONS.timer();}if(event.key==='Enter'&&state.screen==='question'&&record()?.status==='done'&&event.target===document.body){event.preventDefault();ACTIONS.next();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseActive();persist();render();}});
window.addEventListener('beforeunload',()=>{pauseActive();persist();});
let lastTick=performance.now(),lastSaved=0;
setInterval(()=>{const now=performance.now(),elapsed=(now-lastTick)/1000;lastTick=now;if(modal)return;const r=activeTimer();if(r?.status!=='running')return;const finished=tick(elapsed);if(finished){render();sound('wrong');}else renderTimer();if(now-lastSaved>1000){persist();lastSaved=now;}},100);
render();
</script></body></html>
